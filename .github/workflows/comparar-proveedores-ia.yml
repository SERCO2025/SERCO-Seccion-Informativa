name: Comparar proveedores gratuitos de IA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-free-ai-providers:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: \${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar que exista al menos un proveedor configurado
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" && -z "$GROQ_API_KEY" && ( -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ) ]]; then
            echo "No hay credenciales de proveedores configuradas en GitHub Actions Secrets."
            exit 1
          fi
      - name: Ejecutar comparación con evidencia ficticia
        run: node scripts/compare-ai-providers.js
