name: Pruebas de adaptadores IA

on:
  push:
    branches:
      - desarrollo
    paths:
      - "src/services/ai/**"
      - "src/services/knowledge/**"
      - "src/services/research/**"
      - "supabase/migrations/**"
      - "api/**"
      - "tests/**"
      - ".github/workflows/pruebas-adaptadores-ia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai-provider-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar suite completa
        run: node --test tests/*.test.js
