<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Acceso editorial SERCO</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f5;font:14px system-ui;color:#203a34}
main{width:min(390px,calc(100% - 40px));background:#fff;border:1px solid #dce5e0;border-radius:16px;padding:30px;box-shadow:0 18px 50px #173c371a}
h1{font-size:23px;margin:0 0 8px}p{color:#73827c;font-size:12px;margin:0 0 22px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d6e0db;border-radius:8px}
button{width:100%;margin-top:20px;padding:12px;background:#183c37;color:#fff;border:0;border-radius:8px;font-weight:700}
#error{display:none;color:#93443f;background:#fff3f1;border:1px solid #e8c5c0;padding:10px;border-radius:8px;margin-top:12px;font-size:12px}
</style>
</head>
<body>
<main>
<h1>SERCO · Acceso administrativo</h1>
<p>Inicia sesión con la cuenta autorizada para administrar la biblioteca técnica.</p>
<form id="login">
<label for="email">Correo autorizado</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Iniciar sesión</button>
<div id="error" role="alert"></div>
</form>
</main>
<script>
"use strict";
const form=document.getElementById("login"),button=document.getElementById("submit"),error=document.getElementById("error");
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;error.style.display="none";
 try{
  const response=await fetch("/api/editor-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",email:document.getElementById("email").value,password:document.getElementById("password").value})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error&&data.error.message||"No fue posible iniciar sesión.");
  sessionStorage.setItem("serco_editor_access_token",data.access_token);
  location.replace("/dashboard.html");
 }catch(err){error.textContent=err.message;error.style.display="block";}
 finally{button.disabled=false;}
});
</script>
</body>
</html>
