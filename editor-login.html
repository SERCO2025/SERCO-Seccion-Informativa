<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#142b35">
<title>SERCO | Acceso editorial</title>
<style>
:root{color-scheme:dark;--navy:#142b35;--teal:#247b78;--gold:#bd925d;--ink:#20343c;--muted:#7d8c93;--line:#e1e8eb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 12%,#2d6265 0,transparent 33%),linear-gradient(135deg,#142b35,#1c424d 62%,#235c5e);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.card{width:min(440px,100%);background:#fff;border:1px solid #ffffff70;border-radius:20px;padding:34px;box-shadow:0 28px 90px #071a224d}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:29px}.mark{width:43px;height:43px;border:1px solid var(--gold);border-radius:13px;background:linear-gradient(145deg,#315966,#172f39);display:grid;place-items:center;color:#f1d6b5;font-size:18px;font-weight:850;letter-spacing:-2px}.brand b{display:block;color:var(--navy);font-size:15px;letter-spacing:.16em}.brand small{display:block;color:#87959b;font-size:9px;letter-spacing:.15em;text-transform:uppercase;margin-top:2px}
.eyebrow{color:var(--teal);font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}h1{font-size:25px;line-height:1.2;letter-spacing:-.04em;color:var(--navy);margin:0 0 8px}p{color:var(--muted);font-size:11px;margin:0 0 23px}
label{display:block;color:#53666e;font-size:10px;font-weight:750;margin:14px 0 6px}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfcfd;color:var(--ink);font:inherit;font-size:12px}input:focus{outline:3px solid #247b7824;border-color:#6ca8a3;background:#fff}
button{width:100%;margin-top:20px;padding:12px 14px;border:1px solid var(--teal);border-radius:9px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;cursor:pointer}button:hover{background:#1e6b69}button:disabled{opacity:.6;cursor:wait}
#error{display:none;color:#a64c4c;background:#fff5f4;border:1px solid #f0d9d6;padding:10px 11px;border-radius:8px;margin-top:12px;font-size:10px}#error.show{display:block}
.foot{border-top:1px solid #edf0f1;margin-top:22px;padding-top:15px;color:#9aa5aa;font-size:9px;text-align:center}
@media(max-width:480px){.card{padding:26px 22px}}
</style>
</head>
<body>
<main class="card">
 <div class="brand"><div class="mark">S.</div><div><b>SERCO</b><small>Redacción y conocimiento</small></div></div>
 <div class="eyebrow">Espacio de administración</div>
 <h1>Acceso editorial</h1>
 <p>Ingresa con la cuenta autorizada para administrar publicaciones, revisar investigaciones y mantener la biblioteca de conocimiento de SERCO.</p>
 <form id="login">
  <label for="email">Correo electrónico</label>
  <input id="email" type="email" autocomplete="username" placeholder="Correo de la cuenta autorizada" required>
  <label for="password">Contraseña</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
  <button id="submit" type="submit">Entrar al centro editorial</button>
  <div id="error" role="alert"></div>
 </form>
 <div class="foot">Acceso restringido · Autenticación protegida por Supabase</div>
</main>
<script>
"use strict";
const form=document.getElementById("login"),button=document.getElementById("submit"),error=document.getElementById("error");
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="Verificando acceso…";error.classList.remove("show");
 try{
  const response=await fetch("/api/editor-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",email:document.getElementById("email").value,password:document.getElementById("password").value})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error&&data.error.message||"No fue posible iniciar sesión.");
  sessionStorage.setItem("serco_editor_access_token",data.access_token);
  location.replace("/dashboard.html");
 }catch(err){error.textContent=err.message;error.classList.add("show");}
 finally{button.disabled=false;button.textContent="Entrar al centro editorial";}
});
</script>
</body>
</html>
