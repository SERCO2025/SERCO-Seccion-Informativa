<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERCO · Sección Informativa</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#071019;color:#f4f7fa;display:flex;justify-content:center;padding:70px 20px}.knowledge{width:min(980px,100%);text-align:center}h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.subtitle{margin:0 auto 28px;max-width:700px;color:#b9c4ce;line-height:1.55}.search{display:flex;gap:10px;max-width:780px;margin:auto}.search input{flex:1;background:transparent;border:1px solid rgba(255,255,255,.72);border-radius:4px;color:white;padding:16px 18px;font-size:17px;outline:none}.search button{border:1px solid rgba(255,255,255,.8);background:#fff;color:#111;border-radius:4px;padding:0 22px;font-weight:700;cursor:pointer}.results{max-width:780px;margin:18px auto 0;text-align:left;display:none}.results.active{display:block}.result{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);padding:16px;margin-bottom:9px;border-radius:5px;cursor:pointer}.result:hover{background:rgba(255,255,255,.09)}.result small{color:#9eabb7}.article{max-width:780px;margin:18px auto 0;text-align:left;display:none;border:1px solid rgba(255,255,255,.15);padding:28px;border-radius:6px;background:rgba(0,0,0,.18)}.article.active{display:block}.article h2{margin-top:0}.back{background:none;color:#cfd8df;border:0;cursor:pointer;padding:0;margin-bottom:18px}@media(max-width:620px){.search{flex-direction:column}.search button{height:48px}}</style></head><body><main class="knowledge"><h1>Conocimiento SERCO</h1><p class="subtitle">¿Tienes alguna duda sobre construcción, urbanización o pavimentación? Escríbela aquí y consulta nuestra información.</p><form class="search" id="searchForm"><input id="query" autocomplete="off" placeholder="Escribe tu búsqueda..." aria-label="Buscar información"><button type="submit">Buscar 🔍</button></form><section class="results" id="results" aria-live="polite"></section><article class="article" id="article"></article></main><script>const data=[{id:1,title:"¿Qué es un vano?",tags:["vano","muro","arquitectura"],summary:"Definición y relación con otros elementos constructivos.",body:"El vano es una abertura o espacio practicado en un muro u otro elemento constructivo. Esta ficha es contenido de demostración del prototipo."},{id:2,title:"¿Qué es un lindero?",tags:["lindero","predio","deslinde"],summary:"Concepto relacionado con los límites de un predio.",body:"Un lindero es la línea o límite que separa un predio de otro o de un espacio distinto."},{id:3,title:"Cimentación para muros",tags:["cimentación","cimiento","muro"],summary:"Ejemplo de cómo un contenido puede relacionarse con otros temas.",body:"Esta ficha demuestra la navegación entre temas. En la versión real podrá incorporar fotografías, diagramas, tablas y videos."}];const form=document.querySelector('#searchForm'),q=document.querySelector('#query'),results=document.querySelector('#results'),article=document.querySelector('#article');function search(){const term=q.value.trim().toLowerCase();article.classList.remove('active');if(!term){results.classList.remove('active');results.innerHTML='';return}const found=data.filter(x=>(x.title+' '+x.tags.join(' ')+' '+x.summary).toLowerCase().includes(term));results.innerHTML=found.length?found.map(x=>`<div class="result" data-id="${x.id}"><strong>${x.title}</strong><br><small>${x.summary}</small></div>`).join(''):`<div class="result">No encontramos resultados todavía.</div>`;results.classList.add('active')}form.addEventListener('submit',e=>{e.preventDefault();search()});results.addEventListener('click',e=>{const el=e.target.closest('.result[data-id]');if(!el)return;const x=data.find(a=>a.id==el.dataset.id);results.classList.remove('active');article.innerHTML=`<button class="back" onclick="backToResults()">← Volver a resultados</button><h2>${x.title}</h2><p>${x.body}</p><p><strong>Conceptos relacionados:</strong> ${x.tags.join(' · ')}</p>`;article.classList.add('active')});function backToResults(){article.classList.remove('active');search()}</script></body></html>
