<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Publicación · SERCO</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202a33;background:#edf1f4}*{box-sizing:border-box}body{margin:0;background:#edf1f4}.top{height:58px;background:#101d29;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1120px)/2))}.top a{color:#d8e4ed;text-decoration:none;font-size:13px}.brand{font-size:13px;font-weight:800;letter-spacing:.13em}.page{width:min(920px,calc(100% - 28px));margin:34px auto 60px}.paper,.state{background:#fff;border:1px solid #dce3e8;border-radius:5px;box-shadow:0 12px 38px rgba(24,39,52,.06);padding:clamp(22px,5vw,62px)}.state{color:#52616d;line-height:1.6}.kicker{display:flex;flex-wrap:wrap;gap:9px;color:#647584;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.kicker span+span:before{content:"·";margin-right:9px;color:#a2afb9}h1{font-size:clamp(30px,5vw,46px);line-height:1.12;letter-spacing:-.035em;color:#172633;margin:18px 0 14px}.summary{font-size:18px;line-height:1.6;color:#536575;margin:0 0 24px}.byline{border-block:1px solid #e4e9ed;padding:13px 0;margin:22px 0 34px;color:#687887;font-size:12px}.article{font-size:16px;line-height:1.82;color:#303b44;overflow-wrap:anywhere}.article h1{font-size:30px}.article h2{font-size:25px;line-height:1.28;color:#203444;margin:1.75em 0 .65em;padding-bottom:9px;border-bottom:1px solid #e2e8ec}.article h3{font-size:20px;color:#2a4659;margin:1.5em 0 .55em}.article h4,.article h5,.article h6{font-size:17px;color:#334d5e}.article p{margin:0 0 1.15em}.article>p:first-of-type:first-letter{float:left;font-size:3.2em;line-height:.85;padding:.06em .11em 0 0;font-weight:700;color:#1e607c}.article strong,.article b{color:#1e3445}.article u{text-decoration-color:#4a91aa;text-decoration-thickness:2px;text-underline-offset:3px}.article a{color:#176b91;text-underline-offset:3px}.article ul,.article ol{padding-left:1.5em;margin:.35em 0 1.3em}.article li{margin:.35em 0}.article blockquote{margin:1.6em 0;padding:15px 22px;border-left:4px solid #46829c;background:#f1f6f8;color:#4b5d69}.article table{width:100%;border-collapse:collapse;margin:1.5em 0;font-size:14px;display:block;overflow-x:auto}.article th,.article td{border:1px solid #d9e1e6;padding:10px 12px;text-align:left;vertical-align:top}.article th{background:#edf3f6;color:#263e4e}.article figure{margin:1.8em 0;text-align:center}.article figure img{max-width:100%;height:auto}.article figcaption{font-size:13px;color:#697987}.section{border-top:1px solid #e1e7eb;margin-top:34px;padding-top:23px}.section h2{font-size:19px;color:#243b4b;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.media{margin:0;border:1px solid #e0e7eb;border-radius:4px;overflow:hidden;background:#fbfcfd}.media.wide{grid-column:1/-1}.media img,.media video{display:block;width:100%;max-height:520px;object-fit:contain;background:#f0f3f5}.media figcaption{padding:11px 13px;font-size:13px;line-height:1.5;color:#536574}.credit{display:block;color:#7a8994;font-size:11px;margin-top:5px}.download{display:block;padding:18px;color:#245d79;font-weight:700;overflow-wrap:anywhere}.refs,.related{padding-left:21px;line-height:1.65;color:#475865}.refs li,.related li{margin-bottom:9px}.refs a,.related a{color:#176b91}.technical-concept{position:relative;display:inline-block;color:#176b91;background:#eaf4f8;border-bottom:1px dotted #176b91;border-radius:2px;padding:0 2px;cursor:help}.technical-concept:focus-visible{outline:2px solid #176b91;outline-offset:2px}.concept-popover{position:absolute;z-index:20;left:0;top:calc(100% + 8px);display:block;width:min(330px,80vw);padding:13px 15px;background:#172c39;color:#f4f7f9;border:1px solid #456171;border-radius:7px;box-shadow:0 10px 28px #142b3540;text-align:left;font-size:13px;line-height:1.55;white-space:normal;cursor:default}.concept-popover[hidden]{display:none}.concept-popover-definition{display:block}.concept-popover-source{display:inline-block;color:#b8e1f0;margin-top:9px;text-decoration:underline}.concept-popover-related{display:block;margin-top:8px;color:#d8c49e;font-size:11px}.concept-popover-related a{color:#d8c49e;margin-right:8px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:24px}.tag{font-size:11px;color:#526a79;background:#edf3f6;border-radius:20px;padding:5px 10px}footer{text-align:center;color:#87939c;font-size:12px;padding:22px}@media(max-width:650px){.top{height:52px;padding:0 14px}.page{margin:15px auto 34px;width:calc(100% - 16px)}.paper,.state{padding:22px 17px}.summary{font-size:16px}.article{font-size:15px;line-height:1.75}.article h2{font-size:22px}.grid{grid-template-columns:1fr}.media.wide{grid-column:auto}}@media print{body{background:#fff}.top,footer{display:none}.page{width:100%;margin:0}.paper{border:0;box-shadow:none;padding:0}.article{font-size:11pt}.media{break-inside:avoid}}
</style></head><body><header class="top"><div class="brand">SERCO · CONOCIMIENTO TÉCNICO</div><a href="/">Volver a consultar</a></header>
<main class="page"><div id="state" class="state" role="status">Cargando publicación...</div><article id="paper" class="paper" hidden><header><div id="kicker" class="kicker"></div><h1 id="title"></h1><p id="summary" class="summary"></p><div id="byline" class="byline"></div></header><div id="content" class="article"></div><section id="mediaSection" class="section" hidden><h2>Material gráfico y recursos</h2><div id="mediaGrid" class="grid"></div></section><section id="sourcesSection" class="section" hidden><h2>Fuentes y referencias</h2><ol id="sources" class="refs"></ol></section><section id="relatedSection" class="section" hidden><h2>Publicaciones relacionadas</h2><ul id="related" class="related"></ul></section><div id="tags" class="tags"></div></article></main><footer>Biblioteca informativa · SERCO</footer>
<script>
(function(){"use strict";const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);const lookup=params.get("public_id")?"public_id="+encodeURIComponent(params.get("public_id")):params.get("id")?"id="+encodeURIComponent(params.get("id")):"";
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}
function date(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("es-MX",{dateStyle:"long"}).format(d)}
function credit(parent,item){const value=[item.author,item.license].filter(Boolean).join(" · ");if(value)parent.appendChild(el("small",value,"credit"));if(typeof item.source_url==="string"&&(item.source_url.toLowerCase().startsWith("https://")||item.source_url.toLowerCase().startsWith("http://"))){const line=el("small",undefined,"credit"),a=el("a","Fuente del recurso");a.href=item.source_url;a.target="_blank";a.rel="noopener noreferrer";line.appendChild(a);parent.appendChild(line)}}
function mediaCard(link){const item=link.media_file||{},url=item.url;if(!url)return null;const card=el("figure",undefined,"media"+(link.display_mode==="wide"?" wide":"")),type=String(item.mime_type||"").toLowerCase();if(type.startsWith("image/")){const img=el("img");img.src=url;img.alt=link.alt_text_override||item.alt_text||item.original_name||"Recurso gráfico";img.loading="lazy";img.decoding="async";card.appendChild(img)}else if(type.startsWith("video/")){const video=el("video");video.controls=true;video.preload="metadata";video.playsInline=true;const source=el("source");source.src=url;source.type=type;video.appendChild(source);card.appendChild(video)}else{const a=el("a",item.original_name||"Abrir documento","download");a.href=url;a.target="_blank";a.rel="noopener noreferrer";card.appendChild(a)}const caption=link.caption||item.description||item.original_name;if(caption){const fig=el("figcaption",caption);credit(fig,item);card.appendChild(fig)}else credit(card,item);return card}
function placeMedia(links){const content=$("content"),groups=new Map();links.forEach(link=>{const card=mediaCard(link);if(!card)return;const key=String(link.section_key||"body").trim().toLocaleLowerCase();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(card)});for(const [key,cards] of groups){if(key!=="body"){const heading=[...content.querySelectorAll("h1,h2,h3,h4,h5,h6")].find(h=>h.textContent.trim().toLocaleLowerCase()===key);if(heading){cards.reverse().forEach(card=>heading.insertAdjacentElement("afterend",card));continue}}const grid=el("div",undefined,"grid");cards.forEach(card=>grid.appendChild(card));if(key==="body")$("mediaGrid").appendChild(grid);else{const section=el("section",undefined,"section");section.appendChild(el("h2","Recursos relacionados"));section.appendChild(grid);content.appendChild(section)}}if($("mediaGrid").children.length)$("mediaSection").hidden=false}
function renderSources(items){items.forEach(item=>{const li=el("li");if(item.source_url&&/^https?:\/\//i.test(item.source_url)){const a=el("a",item.title||item.source_url);a.href=item.source_url;a.target="_blank";a.rel="noopener noreferrer";li.appendChild(a)}else li.textContent=item.title||"Referencia";const extra=[item.author,item.published_date].filter(Boolean).join(" · ");if(extra)li.appendChild(document.createTextNode(" · "+extra));$("sources").appendChild(li)});$("sourcesSection").hidden=!items.length}
function renderConcepts(items){const concepts=Array.isArray(items)?items:[],byKey=new Map(concepts.map(item=>[item.key,item])),nodes=[...$("content").querySelectorAll("span.technical-concept[data-concept-key]")],firstNodes=new Map();nodes.forEach(node=>{const item=byKey.get(node.dataset.conceptKey);if(!item){node.classList.remove("technical-concept");node.removeAttribute("data-concept-key");return}node.setAttribute("role","button");node.setAttribute("tabindex","0");node.setAttribute("aria-haspopup","true");node.setAttribute("aria-expanded","false");node.setAttribute("aria-label",item.term+": ver definición");if(!firstNodes.has(item.key)){node.id="concept-"+item.key;firstNodes.set(item.key,node)}});function closeAll(){nodes.forEach(node=>{const popup=node.querySelector(".concept-popover");if(popup)popup.hidden=true;node.setAttribute("aria-expanded","false")})}function open(node,item){let popup=node.querySelector(".concept-popover");if(popup){const show=popup.hidden;closeAll();popup.hidden=!show;node.setAttribute("aria-expanded",String(show));return}closeAll();popup=el("span",undefined,"concept-popover");popup.setAttribute("role","tooltip");const definition=el("span",item.definition,"concept-popover-definition");popup.appendChild(definition);const source=el("a","Consultar fuente","concept-popover-source");source.href=item.source_url;source.target="_blank";source.rel="noopener noreferrer";popup.appendChild(source);const related=(item.related_keys||[]).map(key=>byKey.get(key)).filter(Boolean);if(related.length){const group=el("span","Conceptos relacionados: ","concept-popover-related");related.forEach(other=>{const link=el("a",other.term);link.href="#concept-"+other.key;link.addEventListener("click",event=>{event.preventDefault();const target=firstNodes.get(other.key);if(target){target.scrollIntoView({behavior:"smooth",block:"center"});open(target,other)}});group.appendChild(link)});popup.appendChild(group)}node.appendChild(popup);popup.hidden=false;node.setAttribute("aria-expanded","true")}nodes.forEach(node=>{const item=byKey.get(node.dataset.conceptKey);if(!item)return;node.addEventListener("click",event=>{if(event.target.closest("a"))return;open(node,item)});node.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();open(node,item)}else if(event.key==="Escape"){const popup=node.querySelector(".concept-popover");if(popup)popup.hidden=true;node.setAttribute("aria-expanded","false")}})})}
function loadRelated(items){items.forEach(item=>{if(!item.related||!item.related.public_id)return;const li=el("li"),a=el("a",item.related.title||item.related.public_id);a.href="/publication.html?public_id="+encodeURIComponent(item.related.public_id);li.appendChild(a);$("related").appendChild(li)});$("relatedSection").hidden=!$("related").children.length}
async function load(){if(!lookup){$("state").textContent="Falta el identificador de la publicación. Regresa a la consulta y abre el documento desde su referencia.";return}try{const response=await fetch("/api/publication?"+lookup,{cache:"no-store",headers:{Accept:"application/json"}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error&&data.error.message||"No fue posible recuperar la publicación.");const p=data.publication||{},c=p.content||{};document.title=(p.title||"Publicación")+" · SERCO";$("title").textContent=p.title||c.title||"Publicación técnica";$("summary").textContent=p.summary||c.summary||"";[p.public_id,p.specialty,p.content_type].filter(Boolean).forEach(v=>$("kicker").appendChild(el("span",v)));$("byline").textContent=[p.author?"Autor: "+p.author:"",p.version?"Versión "+p.version:"",date(p.updated_at)].filter(Boolean).join(" · ");$("content").innerHTML=typeof c.content_html==="string"?c.content_html:"";if(!$("content").textContent.trim())$("content").textContent=c.content_text||"El documento no contiene texto disponible.";const linked=Array.isArray(data.asset_links)?data.asset_links:[];const legacy=(Array.isArray(data.assets)?data.assets:[]).map(asset=>({media_file:asset,section_key:"body",caption:asset.description||asset.original_name,display_mode:"inline"}));placeMedia(linked.concat(legacy));renderSources(Array.isArray(data.sources)?data.sources:[]);renderConcepts(Array.isArray(data.concepts)?data.concepts:[]);loadRelated(Array.isArray(data.relations)?data.relations:[]);(Array.isArray(data.tags)?data.tags:[]).forEach(t=>$("tags").appendChild(el("span",t.name,"tag")));(Array.isArray(data.categories)?data.categories:[]).forEach(t=>{if(t.name)$("tags").appendChild(el("span",t.name,"tag"))});$("state").hidden=true;$("paper").hidden=false}catch(error){$("state").textContent="No se pudo abrir la publicación: "+(error.message||"Intenta nuevamente más tarde.")}}load()})();
</script></body></html>
